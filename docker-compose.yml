services:
  postgres:
    image: postgres:15-alpine
    container_name: flash_sale_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flash_sale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_sale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: flash_sale_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/flash_sale?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: flash_sale_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: